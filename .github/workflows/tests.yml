name: Run tests

on: 
    push: 
        branches: 
            - main 
    pull_request: 
        branches: 
            - main

jobs: 
    tests: 
        runs-on: ubuntu-latest

        steps: 
            - name: Checkout 
              uses: actions/checkout@v4
            - name: setup node 
              uses: actions/setup-node@v2
              with: 
                  node-version: '20.19.0'
            - name: install dependencies
              run: npm ci
            - name: run tests 
              run: npm test
